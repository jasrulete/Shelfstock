# ShelfStock - full stack in Docker.
#
#   docker compose up -d --build
#
# Services: db (PostgreSQL 17) -> web (Next.js, :3000).
#
# There is no longer a separate api service. The Express API runs inside the
# Next.js deployment as a serverless function (frontend/pages/api/[...path].ts),
# so the app is one deployable unit and the browser talks to /api on its own
# origin. Host ports are overridable via WEB_PORT and DB_PORT - see the
# "Run with Docker" section of README.md.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shelfstock
    volumes:
      - db_data:/var/lib/postgresql/data
      # First boot on an empty volume auto-applies the schema + demo seed
      # data. To re-apply later (it's idempotent):
      #   docker compose exec db psql -U postgres -d shelfstock -f /docker-entrypoint-initdb.d/schema.sql
      - ./frontend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # Host 5433 by default so a locally installed Postgres on 5432 doesn't clash.
      - '${DB_PORT:-5433}:5432'
    healthcheck:
      # -h 127.0.0.1 forces a TCP check, so the socket-only temporary server
      # that runs during first-boot init doesn't count as "ready".
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d shelfstock']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
    environment:
      # `db` resolves to the Postgres container on the compose network.
      # sslmode=disable is required: server/db/index.ts enables TLS for any
      # non-local host, and the bundled Postgres doesn't speak SSL.
      DATABASE_URL: postgres://postgres:postgres@db:5432/shelfstock?sslmode=disable
      # Dev-only default (the API rejects requests with fewer than 32 chars).
      # Override for anything beyond a local demo:
      #   JWT_SECRET=$(openssl rand -hex 32) docker compose up -d
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please}
      # No NEXT_PUBLIC_API_URL and no CORS_ORIGIN: the browser calls /api on
      # the same origin it loaded the page from, so there is nothing to
      # configure and nothing that can drift out of sync.
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health touches Postgres, so this reports ready only when the app
      # can actually serve data.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  db_data:
