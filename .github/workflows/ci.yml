name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so the static build succeeds; real values are set
          # at deploy time.
          NEXT_PUBLIC_API_URL: http://localhost:4000

      # Fails the build on a known-vulnerable dependency. Scoped to high and
      # above so a low-severity advisory in a dev tool can't block a deploy,
      # and to production deps because that is what actually ships.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Dockerized stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and start db + api containers
        run: docker compose up -d --wait --build db api

      - name: Run end-to-end smoke test
        run: node backend/scripts/e2e-smoke.mjs
        env:
          PROMOTE_CMD: docker compose exec -T db psql -U postgres -d shelfstock -c "UPDATE users SET role='admin' WHERE email='{EMAIL}'"

      - name: API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v
