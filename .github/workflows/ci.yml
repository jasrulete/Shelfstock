name: CI

on:
  push:
    branches: [main]
  pull_request:

# The separate backend job is gone with the backend directory: the Express API
# now runs inside the Next.js deployment, so one job covers the whole app.
jobs:
  app:
    name: App (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The storefront pages are Server Components, so the build imports
          # the server modules to collect page data - and the pg Pool is
          # constructed at import time, throwing without a connection string.
          # These are placeholders that are never connected to: every page that
          # reads the database is force-dynamic, so nothing queries at build
          # time. Same values the Dockerfile already uses for the same reason.
          DATABASE_URL: postgres://build:build@localhost:5432/build
          JWT_SECRET: build-time-placeholder-value-32-characters

      # Fails the build on a known-vulnerable dependency. Scoped to high and
      # above so a low-severity advisory in a dev tool can't block a deploy,
      # and to production deps because that is what actually ships.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Dockerized stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `--wait` blocks on the web healthcheck, which calls /api/health and so
      # only passes once the serverless API can actually reach Postgres.
      - name: Build and start the stack
        run: docker compose up -d --wait --build

      - name: Run end-to-end smoke test
        run: node frontend/scripts/e2e-smoke.mjs
        env:
          # Same origin as the app now - there is no separate API port.
          API_URL: http://localhost:3000/api
          PROMOTE_CMD: docker compose exec -T db psql -U postgres -d shelfstock -c "UPDATE users SET role='admin' WHERE email='{EMAIL}'"

      - name: App logs on failure
        if: failure()
        run: docker compose logs web

      - name: Tear down
        if: always()
        run: docker compose down -v
